name: Deploy Astro to XMIT

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: deploy-xmit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      XMIT_SITE: helstonfloraday.xmit.dev@839
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
        env:
          NPM_CONFIG_FUND: false
          NPM_CONFIG_AUDIT: false

      - run: npm run build

      - name: Deploy to XMIT
        env:
          XMIT_KEY: ${{ secrets.XMIT_KEY }}
        run: npm run deploy
